name: local_imagent_J
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - openjdk=21
  - maven
  - pip
  # ImageJ/Java bridge
  - pyimagej=1.7.0
  - jpype1=1.6.0
  - scyjava=1.12.1
  - imglyb=2.1.0
  - jgo=1.0.6
  # GUI
  - pyside6
  # Data science
  - numpy
  - pandas
  - scipy
  - seaborn
  - matplotlib
  - matplotlib-base
  # Grammar-of-graphics plotting (ggplot2-style) — the 'plotnine' skill. statsmodels
  # backs geom_smooth(method="lm"/"lowess"); scikit-misc backs method="loess".
  - plotnine
  - statsmodels
  - scikit-misc
  - xarray
  - tifffile
  # Image analysis / ML (python_coder agent)
  - scikit-image
  - scikit-learn
  # imageio: used by the bioimage course python demos
  - imageio
  # LangChain / LangGraph
  - langchain
  - langgraph
  - langgraph-checkpoint
  - langgraph-prebuilt
  - langgraph-sdk
  - langsmith
  # Utilities
  - pyyaml
  - requests
  - httpx
  - ipython
  - ipykernel
  - sqlalchemy
  - pydantic
  - jsonschema
  - psutil
  - nest-asyncio
  - aiohttp
  - pip:
      #- accelerate
      - aiofiles
      - aiohttp-retry
      - anthropic
      - antlr4-python3-runtime
      - beautifulsoup4
      # Big-FISH: non-deep-learning smFISH/puncta spot detection (LoG + local maxima)
      # whose intensity threshold is chosen AUTOMATICALLY by the elbow method, so the
      # agent supplies only physical values (voxel size + spot radius in nm). Pulls
      # `mrc` as its only new transitive dep; every other requirement is a lower bound
      # already satisfied by this env (verified: no downgrades on install).
      - big-fish
      # scientific image reading used by the bioimage course (chapters 1.5/1.6)
      - bioio
      - bioio-ome-tiff
      - bioio-tifffile
      - click
      - colorlog
      # CellProfiler's measurement engine as a library. MUST come from GitHub —
      # the PyPI 'cp-measure' exposes the older featurize() API. Builds mahotas
      # from sdist (no cp313 wheel exists) and downgrades pillow to <12 via
      # centrosome; both verified harmless for pyimagej/matplotlib/seaborn.
      - cp_measure @ git+https://github.com/afermg/cp_measure.git
      - dataclasses-json
      - daytona
      - ddgs
      - deepagents
      - deprecated
      - dill
      - distro
      - docling
      - docling-core
      - docling-ibm-models
      - docling-parse
      - docstring-parser
      - environs
      - et-xmlfile
      - fake-useragent
      - fastembed
      - faker
      - filelock
      - filetype
      - fsspec
      - git-filter-repo
      - gitpython
      - grpcio
      - h2
      - httpx-sse
      - huggingface-hub
      - jinja2
      - jiter
      - jsonlines
      - jsonref
      - langchain-anthropic
      - langchain-classic
      - langchain-community
      - langchain-core
      - langchain-docling
      - langchain-openai
      - langchain-pymupdf4llm
      - langchain-qdrant
      - langchain-text-splitters
      - langgraph-checkpoint-sqlite
      - lark
      - latex2mathml
      - lxml
      - markdown-it-py
      - marko
      - markupsafe
      - fastmcp<3
      - marshmallow
      - mistune
      - mcp
      - mpire
      - multipart
      - multiprocess
      - mysql-connector-python
      - networkx
      - opencv-python
      - obstore
      - omegaconf
      - openai
      - openpyxl
